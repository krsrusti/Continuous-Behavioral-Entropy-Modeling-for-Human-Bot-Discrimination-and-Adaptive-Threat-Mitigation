<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TIF — Session Labeller</title>
  <style>
    :root {
      --bg:       #0f1117;
      --surface:  #1a1d27;
      --border:   #2a2d3a;
      --text:     #e2e4ed;
      --muted:    #6b7080;
      --human:    #22c55e;
      --script:   #f59e0b;
      --llm:      #8b5cf6;
      --danger:   #ef4444;
      --accent:   #3b82f6;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'SF Mono', 'Fira Code', monospace;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 2rem;
    }

    /* ── Header ── */
    header {
      display: flex;
      align-items: baseline;
      gap: 1rem;
      margin-bottom: 2rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 1rem;
    }

    header h1 {
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: var(--accent);
    }

    header span {
      font-size: 0.75rem;
      color: var(--muted);
      letter-spacing: 0.05em;
    }

    #status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--danger);
      display: inline-block;
      margin-right: 0.4rem;
      transition: background 0.3s;
    }
    #status-dot.connected { background: var(--human); }

    /* ── Stats bar ── */
    .stats {
      display: flex;
      gap: 1.5rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }

    .stat {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.6rem 1rem;
      font-size: 0.8rem;
    }

    .stat-label { color: var(--muted); margin-bottom: 0.2rem; }
    .stat-value { font-size: 1.2rem; font-weight: 700; }
    .stat-value.human  { color: var(--human);  }
    .stat-value.script { color: var(--script); }
    .stat-value.llm    { color: var(--llm);    }
    .stat-value.total  { color: var(--text);   }

    /* ── Controls ── */
    .controls {
      display: flex;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
      align-items: center;
    }

    .filter-btn {
      padding: 0.4rem 0.9rem;
      border-radius: 4px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      font-family: inherit;
      font-size: 0.78rem;
      cursor: pointer;
      letter-spacing: 0.04em;
      transition: all 0.15s;
    }
    .filter-btn:hover  { border-color: var(--accent); color: var(--text); }
    .filter-btn.active { border-color: var(--accent); color: var(--accent); background: rgba(59,130,246,0.08); }

    #refresh-btn {
      margin-left: auto;
      padding: 0.4rem 0.9rem;
      border-radius: 4px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      font-family: inherit;
      font-size: 0.78rem;
      cursor: pointer;
      transition: all 0.15s;
    }
    #refresh-btn:hover { color: var(--text); border-color: var(--text); }

    /* ── Table ── */
    .table-wrap {
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.78rem;
    }

    thead th {
      background: var(--surface);
      padding: 0.7rem 1rem;
      text-align: left;
      color: var(--muted);
      letter-spacing: 0.06em;
      font-weight: 500;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }

    tbody tr {
      border-bottom: 1px solid var(--border);
      transition: background 0.1s;
    }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: rgba(255,255,255,0.02); }

    td {
      padding: 0.7rem 1rem;
      vertical-align: middle;
      white-space: nowrap;
    }

    .session-id {
      font-size: 0.72rem;
      color: var(--muted);
      font-family: inherit;
    }

    .badge {
      display: inline-block;
      padding: 0.2rem 0.6rem;
      border-radius: 3px;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.06em;
    }
    .badge.human  { background: rgba(34,197,94,0.12);  color: var(--human);  border: 1px solid rgba(34,197,94,0.3);  }
    .badge.script { background: rgba(245,158,11,0.12); color: var(--script); border: 1px solid rgba(245,158,11,0.3); }
    .badge.llm    { background: rgba(139,92,246,0.12); color: var(--llm);    border: 1px solid rgba(139,92,246,0.3); }
    .badge.none   { background: transparent; color: var(--muted); border: 1px solid var(--border); }

    .probe-count { color: var(--accent); }
    .event-count { color: var(--muted);  }

    /* ── Label buttons ── */
    .label-btns {
      display: flex;
      gap: 0.4rem;
    }

    .lbl {
      padding: 0.25rem 0.6rem;
      border-radius: 3px;
      font-family: inherit;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.15s;
      opacity: 0.5;
    }
    .lbl:hover  { opacity: 1; transform: translateY(-1px); }
    .lbl.active { opacity: 1; }

    .lbl.human  { border-color: var(--human);  color: var(--human);  background: rgba(34,197,94,0.08);  }
    .lbl.script { border-color: var(--script); color: var(--script); background: rgba(245,158,11,0.08); }
    .lbl.llm    { border-color: var(--llm);    color: var(--llm);    background: rgba(139,92,246,0.08); }

    /* ── Probe delta sparkline ── */
    .deltas {
      display: flex;
      gap: 3px;
      align-items: flex-end;
      height: 24px;
    }

    .delta-bar {
      width: 5px;
      border-radius: 1px;
      min-height: 2px;
      transition: height 0.2s;
    }

    /* ── Empty state ── */
    .empty {
      text-align: center;
      padding: 4rem 2rem;
      color: var(--muted);
      font-size: 0.85rem;
      line-height: 1.8;
    }

    /* ── Toast ── */
    #toast {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.7rem 1.2rem;
      font-size: 0.8rem;
      opacity: 0;
      transform: translateY(8px);
      transition: all 0.2s;
      pointer-events: none;
      z-index: 999;
    }
    #toast.show { opacity: 1; transform: translateY(0); }
    #toast.ok   { border-color: var(--human); color: var(--human); }
    #toast.err  { border-color: var(--danger); color: var(--danger); }

    /* ── Detail panel ── */
    #detail {
      display: none;
      position: fixed;
      top: 0; right: 0;
      width: 380px;
      height: 100vh;
      background: var(--surface);
      border-left: 1px solid var(--border);
      padding: 1.5rem;
      overflow-y: auto;
      z-index: 100;
    }

    #detail h2 {
      font-size: 0.85rem;
      color: var(--accent);
      margin-bottom: 1rem;
      letter-spacing: 0.06em;
    }

    #detail .close {
      float: right;
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 1.1rem;
      line-height: 1;
    }

    .detail-row {
      display: flex;
      justify-content: space-between;
      padding: 0.4rem 0;
      border-bottom: 1px solid var(--border);
      font-size: 0.75rem;
    }

    .detail-row .k { color: var(--muted); }
    .detail-row .v { color: var(--text); font-weight: 600; }

    .probe-list { margin-top: 1rem; }
    .probe-item {
      display: flex;
      justify-content: space-between;
      padding: 0.35rem 0.6rem;
      margin-bottom: 0.3rem;
      background: var(--bg);
      border-radius: 4px;
      font-size: 0.72rem;
    }
    .probe-item .delta-val { font-weight: 700; }
    .probe-item .delta-val.fast   { color: var(--script); }
    .probe-item .delta-val.normal { color: var(--human);  }
    .probe-item .delta-val.slow   { color: var(--llm);    }
  </style>
</head>
<body>

<header>
  <h1>TIF / SESSION LABELLER</h1>
  <span><span id="status-dot"></span><span id="status-text">connecting…</span></span>
</header>

<div class="stats">
  <div class="stat">
    <div class="stat-label">TOTAL</div>
    <div class="stat-value total" id="count-total">—</div>
  </div>
  <div class="stat">
    <div class="stat-label">HUMAN</div>
    <div class="stat-value human" id="count-human">—</div>
  </div>
  <div class="stat">
    <div class="stat-label">SCRIPT</div>
    <div class="stat-value script" id="count-script">—</div>
  </div>
  <div class="stat">
    <div class="stat-label">LLM</div>
    <div class="stat-value llm" id="count-llm">—</div>
  </div>
  <div class="stat">
    <div class="stat-label">UNLABELLED</div>
    <div class="stat-value total" id="count-none">—</div>
  </div>
</div>

<div class="controls">
  <button class="filter-btn active" data-filter="all">ALL</button>
  <button class="filter-btn" data-filter="null">UNLABELLED</button>
  <button class="filter-btn" data-filter="human">HUMAN</button>
  <button class="filter-btn" data-filter="script">SCRIPT</button>
  <button class="filter-btn" data-filter="llm">LLM</button>
  <button id="refresh-btn">↻ REFRESH</button>
</div>

<div class="table-wrap">
  <table>
    <thead>
      <tr>
        <th>SESSION ID</th>
        <th>PAGE</th>
        <th>PROBES</th>
        <th>EVENTS</th>
        <th>PROBE DELTAS</th>
        <th>LABEL</th>
        <th>ASSIGN</th>
      </tr>
    </thead>
    <tbody id="tbody">
      <tr><td colspan="7"><div class="empty">Loading sessions…</div></td></tr>
    </tbody>
  </table>
</div>

<div id="detail">
  <button class="close" onclick="closeDetail()">✕</button>
  <h2>SESSION DETAIL</h2>
  <div id="detail-content"></div>
</div>

<div id="toast"></div>

<script>
  const API = 'http://localhost:5000';
  let allSessions = [];
  let currentFilter = 'all';

  // ── Fetch sessions ──────────────────────────────────────────────────────

  async function fetchSessions() {
    try {
      const res  = await fetch(`${API}/api/sessions`);
      allSessions = await res.json();
      document.getElementById('status-dot').classList.add('connected');
      document.getElementById('status-text').textContent = 'connected';
      render();
    } catch (e) {
      document.getElementById('status-text').textContent = 'cannot reach API on :5000';
    }
  }

  // ── Render table ────────────────────────────────────────────────────────

  function render() {
    updateStats();
    const filtered = allSessions.filter(s => {
      if (currentFilter === 'all')  return true;
      if (currentFilter === 'null') return !s.label;
      return s.label === currentFilter;
    });

    const tbody = document.getElementById('tbody');
    if (filtered.length === 0) {
      tbody.innerHTML = `<tr><td colspan="7"><div class="empty">No sessions match this filter.<br>Interact with the login page and submit the form.</div></td></tr>`;
      return;
    }

    tbody.innerHTML = filtered.map(s => {
      const probes   = s.probes || [];
      const deltas   = probes.map(p => p.delta).filter(Boolean);
      const label    = s.label || 'none';
      const sparkline = renderSparkline(deltas);

      return `
        <tr>
          <td>
            <span class="session-id" style="cursor:pointer"
                  onclick="showDetail('${s.session_id}')"
                  title="Click for details">
              ${s.session_id.slice(0, 8)}…
            </span>
          </td>
          <td>${s.page_type || '—'}</td>
          <td class="probe-count">${probes.length}</td>
          <td class="event-count">${(s.passive_events || []).length}</td>
          <td>${sparkline}</td>
          <td><span class="badge ${label}">${label.toUpperCase()}</span></td>
          <td>
            <div class="label-btns">
              <button class="lbl human  ${label==='human'  ? 'active':''}"
                      onclick="assignLabel('${s.session_id}','human')">H</button>
              <button class="lbl script ${label==='script' ? 'active':''}"
                      onclick="assignLabel('${s.session_id}','script')">S</button>
              <button class="lbl llm   ${label==='llm'    ? 'active':''}"
                      onclick="assignLabel('${s.session_id}','llm')">L</button>
            </div>
          </td>
        </tr>`;
    }).join('');
  }

  // ── Sparkline ───────────────────────────────────────────────────────────

  function renderSparkline(deltas) {
    if (!deltas.length) return '<span style="color:var(--muted)">—</span>';
    const max = Math.max(...deltas, 1);
    return `<div class="deltas">${
      deltas.slice(0, 12).map(d => {
        const h   = Math.max(2, Math.round((d / max) * 24));
        const col = d < 80   ? 'var(--script)'
                  : d < 700  ? 'var(--human)'
                  :             'var(--llm)';
        return `<div class="delta-bar" style="height:${h}px;background:${col}" title="${Math.round(d)}ms"></div>`;
      }).join('')
    }</div>`;
  }

  // ── Stats ───────────────────────────────────────────────────────────────

  function updateStats() {
    const total  = allSessions.length;
    const human  = allSessions.filter(s => s.label === 'human').length;
    const script = allSessions.filter(s => s.label === 'script').length;
    const llm    = allSessions.filter(s => s.label === 'llm').length;
    const none   = allSessions.filter(s => !s.label).length;

    document.getElementById('count-total').textContent  = total;
    document.getElementById('count-human').textContent  = human;
    document.getElementById('count-script').textContent = script;
    document.getElementById('count-llm').textContent    = llm;
    document.getElementById('count-none').textContent   = none;
  }

  // ── Assign label ────────────────────────────────────────────────────────

  async function assignLabel(sessionId, label) {
    try {
      const res = await fetch(`${API}/api/session/${sessionId}/label`, {
        method:  'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({ label }),
      });
      if (!res.ok) throw new Error(await res.text());

      // Update local state
      const s = allSessions.find(x => x.session_id === sessionId);
      if (s) s.label = label;

      showToast(`✓ Labelled as ${label.toUpperCase()}`, 'ok');
      render();
    } catch (e) {
      showToast('Failed to label session', 'err');
    }
  }

  // ── Detail panel ────────────────────────────────────────────────────────

  function showDetail(sessionId) {
    const s = allSessions.find(x => x.session_id === sessionId);
    if (!s) return;

    const probes  = s.probes || [];
    const deltas  = probes.map(p => p.delta).filter(Boolean);
    const meanDelta = deltas.length
      ? (deltas.reduce((a,b) => a+b, 0) / deltas.length).toFixed(1)
      : '—';

    document.getElementById('detail-content').innerHTML = `
      <div class="detail-row"><span class="k">SESSION ID</span><span class="v">${s.session_id.slice(0,16)}…</span></div>
      <div class="detail-row"><span class="k">PAGE TYPE</span><span class="v">${s.page_type || '—'}</span></div>
      <div class="detail-row"><span class="k">LABEL</span><span class="v">${s.label || 'unlabelled'}</span></div>
      <div class="detail-row"><span class="k">PASSIVE EVENTS</span><span class="v">${(s.passive_events||[]).length}</span></div>
      <div class="detail-row"><span class="k">PROBES FIRED</span><span class="v">${probes.length}</span></div>
      <div class="detail-row"><span class="k">MEAN DELTA</span><span class="v">${meanDelta} ms</span></div>
      <div class="detail-row"><span class="k">USER AGENT</span><span class="v" style="font-size:0.65rem;max-width:200px;word-break:break-all">${(s.user_agent||'—').slice(0,60)}…</span></div>

      <div class="probe-list">
        <div style="color:var(--muted);font-size:0.72rem;margin:1rem 0 0.5rem">PROBE DELTAS (T2 − T1)</div>
        ${probes.map((p,i) => {
          const d    = p.delta ? p.delta.toFixed(1) : '—';
          const cls  = !p.delta ? '' : p.delta < 80 ? 'fast' : p.delta < 700 ? 'normal' : 'slow';
          const label = cls === 'fast' ? 'SCRIPT-LIKE' : cls === 'slow' ? 'LLM-LIKE' : 'HUMAN-LIKE';
          return `<div class="probe-item">
            <span>Probe #${p.probeId || i+1}</span>
            <span class="delta-val ${cls}">${d} ms</span>
            <span style="color:var(--muted);font-size:0.65rem">${label}</span>
          </div>`;
        }).join('')}
      </div>
    `;
    document.getElementById('detail').style.display = 'block';
  }

  function closeDetail() {
    document.getElementById('detail').style.display = 'none';
  }

  // ── Toast ───────────────────────────────────────────────────────────────

  function showToast(msg, type='ok') {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className   = `show ${type}`;
    setTimeout(() => { t.className = ''; }, 2000);
  }

  // ── Filter buttons ──────────────────────────────────────────────────────

  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentFilter = btn.dataset.filter;
      render();
    });
  });

  document.getElementById('refresh-btn').addEventListener('click', fetchSessions);

  // ── Auto-refresh every 5s ───────────────────────────────────────────────
  fetchSessions();
  setInterval(fetchSessions, 5000);
</script>
</body>
</html>
