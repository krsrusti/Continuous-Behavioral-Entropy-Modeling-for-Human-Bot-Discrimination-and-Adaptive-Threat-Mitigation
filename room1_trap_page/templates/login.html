<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>TIF Trap — Login</title>
  <link rel="stylesheet" href="../static/css/trap.css" />
</head>
<body>
  <div class="trap-card">
    <h2>Sign In</h2>
    <form id="login-form" autocomplete="off">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="you@example.com" required />
      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="••••••••" required />
      <button type="submit">Log In</button>
    </form>
  </div>
  <script src="../static/js/passive_collector.js"></script>
  <script src="../static/js/micro_probe.js"></script>
  <script src="../static/js/session_transmitter.js"></script>
  <script>
    TIFSession.init({ pageType: 'login', apiBase: 'http://localhost:5000' });
  </script>
</body>
</html>
