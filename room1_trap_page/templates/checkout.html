<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>TIF Trap — Checkout</title>
  <link rel="stylesheet" href="../static/css/trap.css" />
</head>
<body>
  <div class="trap-card">
    <h2>Checkout</h2>
    <form id="checkout-form" autocomplete="off">
      <label for="card-name">Name on Card</label>
      <input type="text" id="card-name" name="card-name" placeholder="Jane Smith" required />

      <label for="card-number">Card Number</label>
      <input type="text" id="card-number" name="card-number" placeholder="•••• •••• •••• ••••" maxlength="19" required />

      <div class="row">
        <div>
          <label for="expiry">Expiry</label>
          <input type="text" id="expiry" name="expiry" placeholder="MM/YY" maxlength="5" required />
        </div>
        <div>
          <label for="cvv">CVV</label>
          <input type="text" id="cvv" name="cvv" placeholder="•••" maxlength="4" required />
        </div>
      </div>

      <button type="submit">Pay Now</button>
    </form>
  </div>
  <script src="../static/js/passive_collector.js"></script>
  <script src="../static/js/micro_probe.js"></script>
  <script src="../static/js/session_transmitter.js"></script>
  <script>
    TIFSession.init({ pageType: 'checkout', apiBase: 'http://localhost:5000' });
  </script>
</body>
</html>
